[package]
name = "proyecto2_raytracing"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
# Raylib se usa unicamente para ventana, teclado y presentar el framebuffer.
# Todo el ray tracing, las texturas y el terreno se calculan en CPU.
raylib = { version = "6.0.0", features = ["SUPPORT_IMAGE_GENERATION"] }
